# Self-hosted demo of BlendUs (Oracle Cloud Always Free VM + Cloudflare Tunnel). See DEPLOY.md.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile quick up -d --build
#
# Profiles:  quick  -> random https://*.trycloudflare.com URL, no account or domain needed
#            tunnel -> your own domain through a named Cloudflare Tunnel (CLOUDFLARE_TUNNEL_TOKEN)
name: blendus-prod

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: blendus
      POSTGRES_USER: blendus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blendus -d blendus"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      # Keep models in memory: reloading them made the first AI request after a pause very slow
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Downloads the models once and exits. Runs separately from the backend so a backend restart
  # can never interrupt (and corrupt) a model download again.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list > /dev/null 2>&1; do echo 'waiting for ollama...'; sleep 2; done
        ollama pull nomic-embed-text && ollama pull llama3.2:1b
    restart: "no"

  backend:
    build:
      context: ./smoothies-api
      dockerfile: Dockerfile.prod
    environment:
      APP_NAME: BlendUs
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.prod (see DEPLOY.md)}
      APP_URL: ${PUBLIC_URL:-http://localhost:8080}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: blendus
      DB_USERNAME: blendus
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Only Caddy can reach the backend (it publishes no port), so trusting any proxy is safe here
      TRUSTED_PROXIES: "*"
      PHP_CLI_SERVER_WORKERS: "8"
    volumes:
      # Uploaded photos and avatars survive rebuilds
      - uploads:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        # Seeding generates embeddings, so the models must be there first
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./blendus-frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # Only reachable from the VM itself (curl / SSH tunnel). The public entry point is Cloudflare.
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  tunnel-quick:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://proxy:80
    depends_on:
      - proxy
    restart: unless-stopped
    profiles: ["quick"]

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      # Not marked as required (:?) because Compose would then demand it for the "quick" profile too
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - proxy
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  postgres_data:
  ollama_data:
  uploads:
